<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X Store · אפליקציות לאנדרואיד</title>
<meta name="description" content="X Store, חנות האפליקציות של Xnet: אפליקציות לאנדרואיד להורדה ישירה, כולל VODOS לנגנים בלי אינטרנט.">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Xnet2/GOOGLE-MY/refs/heads/main/image-removebg-preview%20(2).png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f9f9fb; --surface:#fff; --ink:#131417; --muted:#6b6f7c; --muted-2:#a3a6b2; --line:#ececf1;
    --chip:#f3f3f6; --pink:#059669; --pink-soft:#e6f7f0; --purple:#0d9488; --purple-soft:#e2f5f2;
    --shadow:0 30px 70px -40px rgba(15,60,58,.3);
    --mono:ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace;
  }
  :root[data-theme="dark"]{
    --bg:#0f1013; --surface:#17181d; --ink:#f2f2f5; --muted:#9a9db0; --muted-2:#6e7180; --line:#25262e;
    --chip:#202128; --pink:#34d399; --pink-soft:#11291f; --purple:#2dd4bf; --purple-soft:#10302c; --shadow:0 30px 70px -40px rgba(0,0,0,.7);
  }
  *{margin:0; padding:0; box-sizing:border-box;}
  html{overflow-x:clip;}
  body{background:var(--bg); color:var(--ink); font-family:'Rubik',sans-serif; line-height:1.5; transition:background .2s ease;}
  a{color:inherit; text-decoration:none;}
  img{display:block; max-width:100%;}
  button{font-family:inherit; cursor:pointer;}
  .mono{font-family:var(--mono);}

  /* ---------- header ---------- */
  .topline{height:3px; background:linear-gradient(90deg,#5eead4,#34d399,#99f6e4);}
  .st-head{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:16px;
    padding:12px clamp(16px,3vw,32px); background:color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
  }
  .st-brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.2rem;}
  .st-brand img{width:34px; height:34px; border-radius:10px; background:#fff; border:1px solid var(--line); padding:4px;}
  .st-search{flex:1; max-width:420px; margin-inline:auto; position:relative;}
  .st-search input{
    width:100%; font-family:inherit; font-size:16px; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:12px; padding:9px 38px 9px 14px; outline:none;
  }
  .st-search input:focus{border-color:var(--purple);}
  .st-search svg{position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--muted-2);}
  .st-tools{display:flex; align-items:center; gap:6px;}
  .icon-btn{width:34px; height:34px; border-radius:10px; border:0; background:transparent; color:var(--muted); display:flex; align-items:center; justify-content:center;}
  .icon-btn:hover{background:var(--chip); color:var(--ink);}
  .pill-btn{display:inline-flex; align-items:center; gap:7px; font-size:.84rem; font-weight:600; border:1px solid var(--line); background:var(--surface); border-radius:100px; padding:7px 13px;}
  .pill-btn:hover{border-color:var(--muted-2);}

  main{max-width:1240px; margin:0 auto; padding:clamp(24px,4vw,48px) clamp(16px,3vw,32px) 80px;}

  /* ---------- soon banner ---------- */
  .soon{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:var(--purple-soft); color:var(--purple); border-radius:16px; padding:12px 16px; margin-bottom:36px; font-size:.9rem; font-weight:600;
  }
  .soon b{font-weight:800;}
  .soon a{margin-inline-start:auto; font-weight:800; text-decoration:underline; text-underline-offset:3px;}

  /* ---------- home ---------- */
  .label{display:flex; align-items:center; gap:8px; font-size:.86rem; font-weight:700; color:var(--muted); letter-spacing:.04em; margin-bottom:14px;}
  .label svg{color:var(--pink);}
  .featured{
    display:flex; align-items:center; gap:clamp(16px,3vw,32px); flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:clamp(16px,2.4vw,24px) clamp(18px,2.8vw,28px);
    box-shadow:var(--shadow); margin-bottom:48px; cursor:pointer;
    position:relative; overflow:hidden; isolation:isolate;
    --c1:var(--purple); --c2:var(--pink);   /* מוחלפים בצבעי הלוגו של האפליקציה */
  }
  /* כתמי צבע בצבעי הלוגו, שזזים לאט על הכרטיס */
  .featured::before{
    content:''; position:absolute; inset:-40%; z-index:-1; pointer-events:none;
    background:
      radial-gradient(closest-side at 30% 45%, color-mix(in srgb, var(--c1) 30%, transparent), transparent),
      radial-gradient(closest-side at 62% 60%, color-mix(in srgb, var(--c2) 18%, transparent), transparent);
    filter:blur(28px);
    transition:background .6s ease;
  }
  @media (prefers-reduced-motion: no-preference){
    @keyframes tint-drift{
      0%{transform:translate(-14%, -4%) rotate(0deg);}
      50%{transform:translate(12%, 6%) rotate(8deg);}
      100%{transform:translate(-6%, 8%) rotate(-6deg);}
    }
    .featured::before{animation:tint-drift 16s ease-in-out infinite alternate;}
  }
  .st-brand-x{color:var(--purple);}
  .beta{font-size:.7rem; font-weight:700; color:var(--purple); background:var(--purple-soft); border-radius:100px; padding:3px 9px; letter-spacing:0;}
  .rec{display:inline-flex; align-items:center; gap:6px; font-size:.76rem; font-weight:800; color:var(--purple); background:var(--surface); border:1px solid var(--line); border-radius:100px; padding:4px 11px; margin-bottom:12px;}
  .rec i{width:6px; height:6px; border-radius:50%; background:var(--purple);}
  .dl-n{font-size:.8rem; font-weight:600; color:var(--muted);}
  .app-icon{flex:0 0 auto; border-radius:22px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .app-icon img{width:100%; height:100%; object-fit:contain;}
  .featured .app-icon{width:76px; height:76px; padding:8px; border-radius:18px;}
  .featured-body{flex:1 1 280px; min-width:0;}
  .featured h2{font-size:clamp(1.3rem,2.2vw,1.6rem); font-weight:700; letter-spacing:-.02em; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .ver-chip{font-family:var(--mono); font-size:.8rem; font-weight:500; color:var(--muted); background:var(--chip); border:1px solid var(--line); border-radius:8px; padding:3px 8px;}
  .pkg{font-family:var(--mono); font-size:.82rem; color:var(--muted); margin:4px 0 10px; direction:ltr; text-align:right;}
  .featured p{color:var(--ink); font-size:.95rem; margin:4px 0 0;}
  .featured .rec{margin-bottom:8px;}
  .featured .pkg{margin:2px 0 0;}
  .author{display:flex; align-items:center; gap:7px; font-size:.86rem; color:var(--muted);}
  .avatar{width:22px; height:22px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted-2);}
  .featured-cta{display:flex; flex-direction:column; align-items:center; gap:8px;}
  .dl-btn{display:inline-flex; align-items:center; gap:10px; background:var(--ink); color:var(--bg); font-weight:800; font-size:1rem; border-radius:100px; padding:15px 30px; border:0;}
  .dl-btn:hover{opacity:.9;}
  .installs{font-family:var(--mono); font-size:.72rem; letter-spacing:.06em; color:var(--muted-2); display:flex; align-items:center; gap:6px;}

  .bar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-bottom:18px; margin-bottom:22px; border-bottom:1px solid var(--line);}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{font-size:.88rem; font-weight:700; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:100px; padding:8px 16px;}
  .chip.on{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .count{font-size:.84rem; font-weight:600; color:var(--muted);}

  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
  .card{
    display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:22px;
    transition:box-shadow .2s ease, border-color .2s ease; cursor:pointer;
  }
  /* מעבר עכבר: מסגרת דקה בצבע הלוגו של האפליקציה, בלי צל ובלי הבלטה */
  .card:hover{border-color:var(--logo, var(--muted-2)); box-shadow:0 0 0 .5px var(--logo, var(--muted-2));}
  .featured{transition:border-color .2s ease, box-shadow .2s ease;}
  .featured{border-color:transparent;}
  .featured:hover{border-color:transparent; box-shadow:0 34px 70px -38px rgba(15,60,58,.42);}
  .card-top{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
  .card-title{flex:1; min-width:0;}
  .card-title .pkg{margin:2px 0 0;}
  .card-top .dl-count{align-self:flex-start;}
  .card .app-icon{width:52px; height:52px; border-radius:14px; padding:4px;}
  .dl-count.new{color:var(--pink); background:var(--pink-soft); font-family:inherit; font-weight:700;}
  .dl-count{font-family:var(--mono); font-size:.78rem; font-weight:600; color:var(--muted); background:var(--chip); border:1px solid var(--line); border-radius:8px; padding:4px 9px; display:flex; align-items:center; gap:5px; white-space:nowrap;}
  .card h3{font-size:1.08rem; font-weight:800;}
  .card p{color:var(--muted); font-size:.9rem; margin-bottom:10px; flex:1;}
  .card-foot{display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--line); padding-top:16px; margin-top:16px;}
  .card-foot .mono{font-size:.8rem; line-height:1.6;}
  .card-foot small{display:block; color:var(--muted-2); letter-spacing:.06em;}
  .soft-btn{font-size:.86rem; font-weight:700; background:var(--chip); color:var(--ink); border:0; border-radius:100px; padding:9px 18px;}
  .soft-btn:hover{background:var(--line);}
  .ghost-card{
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:8px;
    border:1.5px dashed var(--line); border-radius:22px; padding:22px; color:var(--muted); min-height:240px;
  }
  .ghost-card b{color:var(--ink);}
  .empty{grid-column:1 / -1; text-align:center; color:var(--muted); padding:40px 0;}

  /* ---------- app page ---------- */
  .back{display:inline-flex; align-items:center; gap:8px; color:var(--muted); font-weight:600; margin-bottom:34px;}
  .back:hover{color:var(--ink);}
  .app-layout{display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:clamp(24px,4vw,48px); align-items:start;}
  .app-hero{display:flex; gap:clamp(18px,3vw,32px); align-items:flex-start; margin-bottom:40px;}
  .app-hero .app-icon{width:clamp(110px,13vw,160px); height:clamp(110px,13vw,160px); border-radius:36px; padding:14px; box-shadow:var(--shadow);}
  .app-hero h1{font-size:clamp(1.7rem,3.4vw,2.3rem); font-weight:700; letter-spacing:-.02em; line-height:1.15;}
  .tags{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 26px;}
  .tag{font-size:.8rem; font-weight:700; border-radius:100px; padding:4px 12px; border:1px solid var(--line); background:var(--chip); color:var(--muted);}
  .tag.ver{background:var(--pink-soft); color:var(--pink); border-color:transparent; font-family:var(--mono);}
  .tag.by{background:var(--purple-soft); color:var(--purple); border-color:transparent;}
  .big-dl{display:inline-flex; align-items:center; gap:16px; background:var(--ink); color:var(--bg); border-radius:100px; padding:18px 30px; font-weight:800; font-size:1.08rem;}
  .big-dl .size{font-family:var(--mono); font-weight:500; font-size:.88rem; opacity:.6;}
  .big-dl:hover{opacity:.92;}
  .dl-row{display:flex; gap:10px; max-width:520px;}
  .dl-row .big-dl{flex:1 1 0; min-width:0; justify-content:center; white-space:nowrap; padding:16px 20px; gap:10px;}
  .pc-dl{background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line);}
  .pc-dl:hover{box-shadow:inset 0 0 0 1.5px var(--muted-2); opacity:1;}
  @media (max-width:420px){ .dl-row .big-dl{font-size:.92rem; padding:14px 12px; gap:7px;} .dl-row .size{display:none;} }
  .need{margin-top:12px; font-size:.9rem; font-weight:600; color:var(--ink);}
  .need bdi{white-space:nowrap;}
  .site-links{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:14px;}
  .site-links a{display:inline-flex; align-items:center; gap:5px; font-size:.86rem; font-weight:700; color:var(--muted);}
  .site-links a:hover{color:var(--ink);}
  .also{display:block; margin-top:12px; font-size:.86rem; color:var(--muted);}
  .also a{font-weight:700; color:var(--ink); text-decoration:underline; text-underline-offset:3px;}
  .block{padding-top:28px; margin-top:28px; border-top:1px solid var(--line);}
  .block h2{display:flex; align-items:center; gap:8px; font-size:1.12rem; font-weight:700; margin-bottom:12px;}
  .block h2 svg{color:var(--muted-2);}
  .about{font-size:.98rem; line-height:1.75; color:var(--muted);}
  .about + .about{margin-top:12px;}
  .side-card{background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:22px; margin-bottom:22px;}
  .side-title{font-size:.86rem; font-weight:700; color:var(--muted); letter-spacing:.04em; margin-bottom:12px;}
  .kv{display:flex; justify-content:space-between; gap:10px; padding:13px 0; border-top:1px solid var(--line); font-size:.92rem;}
  .kv:first-of-type{border-top:0; padding-top:4px;}
  .kv span{color:var(--muted);}
  .kv b{font-weight:700;}
  .vlist{display:grid; gap:6px;}
  .vrow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:14px; background:var(--surface); border:1px solid var(--line);}
  .vrow b{font-family:var(--mono); font-size:.95rem; direction:ltr;}
  .vrow small{display:block; font-size:.76rem; color:var(--muted-2);}
  .vrow a{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--muted);}
  .vrow a:hover{background:var(--chip); color:var(--ink);}
  .notes{list-style:none; display:grid; gap:8px;}
  .notes li{display:flex; gap:10px; align-items:flex-start; font-size:.95rem; line-height:1.6; color:var(--muted);}
  .notes li::before{content:''; flex:0 0 auto; width:6px; height:6px; border-radius:50%; background:var(--pink); margin-top:.6em;}
  /* ---------- צילומי מסך ---------- */
  .shots-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px;}
  .shots-hint{font-size:.8rem; color:var(--muted-2); font-weight:600;}
  /* בלי זה שורת הצילומים מותחת את העמוד לרוחב בטלפון */
  .app-layout > *{min-width:0;}
  @media (max-width:640px){
    .gh-btn{display:none;}
    .st-head{gap:10px;}
    /* המומלץ בטלפון: אייקון ליד השם, לא מעליו */
    .featured{gap:14px; align-items:flex-start;}
    .featured .app-icon{width:58px; height:58px; padding:6px; border-radius:15px;}
    .featured-body{flex:1 1 0; min-width:0;}
  }
  .shots-wrap{position:relative;}
  .shots{display:flex; gap:14px; overflow-x:auto; padding:4px 2px 14px; scroll-snap-type:x mandatory; scroll-behavior:smooth; scrollbar-width:none;}
  .shots::-webkit-scrollbar{display:none;}
  /* חיצים במקום פס גלילה: מופיעים במעבר עכבר, ונעלמים בקצה */
  .shots-arrow{
    position:absolute; top:calc(50% - 7px); transform:translateY(-50%); z-index:2;
    width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:color-mix(in srgb, var(--surface) 92%, transparent); color:var(--ink);
    display:flex; align-items:center; justify-content:center; box-shadow:0 10px 24px -12px rgba(19,20,23,.45);
    opacity:0; transition:opacity .2s ease, background .2s ease; cursor:pointer;
  }
  .shots-arrow.prev{right:8px;}
  .shots-arrow.next{left:8px;}
  .shots-wrap:hover .shots-arrow{opacity:1;}
  .shots-arrow:hover{background:var(--surface);}
  .shots-arrow[hidden]{display:none;}
  @media (hover:none){ .shots-arrow{opacity:1;} }
  .shot{
    flex:0 0 auto; width:clamp(150px,22vw,200px); aspect-ratio:640/1136; padding:0; border:1px solid var(--line);
    border-radius:20px; overflow:hidden; background:var(--chip); scroll-snap-align:start; cursor:pointer;
    box-shadow:0 18px 40px -30px rgba(19,20,23,.45); transition:transform .2s ease;
  }
  .shot:hover{transform:translateY(-3px);}
  .shot img{width:100%; height:100%; object-fit:cover;}
  .lightbox{position:fixed; inset:0; z-index:100; background:rgba(12,12,16,.88); display:flex; align-items:center; justify-content:center; padding:24px;}
  .lightbox[hidden]{display:none;}
  .lightbox img{max-height:88vh; max-width:min(92vw,520px); border-radius:22px; box-shadow:0 30px 80px rgba(0,0,0,.5);}
  .lb-btn{position:absolute; width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.12); color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.1rem;}
  .lb-btn:hover{background:rgba(255,255,255,.22);}
  .lb-close{top:18px; left:18px;}
  .lb-prev{right:18px; top:50%; transform:translateY(-50%);}
  .lb-next{left:18px; top:50%; transform:translateY(-50%);}
  .lb-count{position:absolute; bottom:18px; color:#fff; font-family:var(--mono); font-size:.85rem; opacity:.8;}
  @media (max-width:640px){ .lb-prev, .lb-next{top:auto; bottom:10px; transform:none;} .lb-count{bottom:22px;} }
  /* ---------- פרטי האפליקציה ---------- */
  .about a{color:var(--purple); font-weight:700;}
  .pill-link{display:inline-flex; align-items:center; gap:7px; margin-inline-start:10px; vertical-align:middle; font-size:.9rem; font-weight:700; border:1px solid var(--line); background:var(--surface); border-radius:100px; padding:12px 18px;}
  .pill-link:hover{border-color:var(--muted-2);}
  .feat-list{list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:12px 22px;}
  .feat-list li{display:flex; gap:10px; align-items:flex-start; font-size:.92rem; font-weight:400; line-height:1.55; color:var(--muted);}
  .ck{flex:0 0 auto; width:18px; height:18px; border-radius:6px; background:var(--purple-soft); color:var(--purple); display:flex; align-items:center; justify-content:center; margin-top:2px;}
  .step-list{list-style:none; counter-reset:st; display:grid; gap:14px;}
  .step-list li{counter-increment:st; display:grid; grid-template-columns:34px 1fr; gap:12px; font-size:.92rem; line-height:1.65; color:var(--muted);}
  .step-list li::before{content:counter(st); width:34px; height:34px; border-radius:11px; background:var(--chip); display:flex; align-items:center; justify-content:center; font-weight:800; font-family:var(--mono);}
  .hint{margin-top:14px; font-size:.86rem; color:var(--muted); line-height:1.6;}
  .vitem{border-radius:14px; background:var(--surface); border:1px solid var(--line);}
  .vitem .vrow{border:0; background:transparent; list-style:none; cursor:pointer;}
  .vitem .vrow::-webkit-details-marker{display:none;}
  .vrow-tools{display:flex; align-items:center; gap:4px;}
  .vchev{width:8px; height:8px; border-left:2px solid var(--muted-2); border-bottom:2px solid var(--muted-2); transform:rotate(-45deg); margin:0 8px 3px;}
  .vitem[open] .vchev{transform:rotate(135deg); margin-bottom:-3px;}
  .vnotes{list-style:none; display:grid; gap:6px; padding:0 14px 14px;}
  .vnotes li{display:flex; gap:9px; font-size:.86rem; line-height:1.55; color:var(--muted);}
  .vnotes li::before{content:''; flex:0 0 auto; width:5px; height:5px; border-radius:50%; background:var(--pink); margin-top:.6em;}
  @media (max-width:640px){
    .feat-list{grid-template-columns:1fr;}
    .pill-link{margin:10px 0 0; width:100%; justify-content:center;}
  }
  /* ---------- גרסה נוספת באותו עמוד ---------- */
  .variant{display:flex; align-items:center; gap:16px; justify-content:space-between; flex-wrap:wrap; margin-top:28px; padding:16px 18px; border:1px solid var(--line); border-radius:18px; background:var(--surface);}
  .variant-txt{flex:1 1 260px; min-width:0;}
  .variant-txt b{display:block; font-size:.95rem; font-weight:700; margin-bottom:3px;}
  .variant-txt small{display:block; font-size:.86rem; color:var(--muted); line-height:1.55;}
  .variant-txt .pkg{display:block; margin:6px 0 0;}

          <section class="block">

            ${a.about.map(t => `<p class="about">${t}</p>`).join('')}
          </section>
          ${a.features && a.features.length ? `
          <section class="block">
            <h2>מה יש בה</h2>
            <ul class="feat-list">${a.features.map(t => `<li><span class="ck">${ICON_CHECK}</span>${esc(t)}</li>`).join('')}</ul>
          </section>` : ''}
          ${a.steps && a.steps.length ? `
          <section class="block">
            <h2>איך מתקינים</h2>
            <ol class="step-list">${a.steps.map(t => `<li>${esc(t)}</li>`).join('')}</ol>
            ${a.updateHint ? `<p class="hint">${esc(a.updateHint)}</p>` : ''}
          </section>` : ''}
        </div>
        <aside>
          <div class="side-card">
            <div class="side-title">פרטים טכניים</div>
            ${a.repo ? `<div class="kv"><span>הורדות</span><b class="mono">${total(a)}</b></div>` : ''}
            <div class="kv"><span>גודל</span><b class="mono" dir="ltr">${fmtSize(v.size)}</b></div>
            <div class="kv"><span>דרישות</span><b>${a.minAndroid}</b></div>
            ${(a.details || []).map(([k, val]) => `<div class="kv"><span>${k}</span><b>${val}</b></div>`).join('')}
            ${a.repo ? `<div class="kv"><span>מקור</span><b><a href="https://github.com/${a.repo}" target="_blank" rel="noopener">GitHub</a></b></div>` : ''}
            <div class="kv"><span>עדכון אחרון</span><b>${fmtDate(v.date)}</b></div>
          </div>
          <div class="side-title">היסטוריית גרסאות</div>
          <div class="vlist">
            ${a.versions.map((x, i) => `
            <details class="vitem"${i === 0 ? ' open' : ''}>
              <summary class="vrow">
                <div><b>v${x.v}</b><small>${fmtDate(x.date)}</small></div>
                <span class="vrow-tools">
                  ${x.notes && x.notes.length ? '<span class="vchev"></span>' : ''}
                  <a href="${apkUrl(a, x.v)}" aria-label="הורדת גרסה ${x.v}" title="הורדת גרסה ${x.v}">${ICON_DL}</a>
                </span>
              </summary>
              ${x.notes && x.notes.length ? `<ul class="vnotes">${x.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
            </details>`).join('')}
          </div>
        </aside>
      </div>`;
  }

  // ---------- צבעי הלוגו ----------
  // שני הגוונים הבולטים באייקון (למשל טורקיז וורוד ב-VODOS), בשביל הכרטיס המומלץ
  function logoColors(app) {
    if (app.tint) return Promise.resolve(app.tint);
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        try {
          const N = 48, c = document.createElement('canvas');
          c.width = c.height = N;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, N, N);
          const px = ctx.getImageData(0, 0, N, N).data;
          const bins = {};
          for (let i = 0; i < px.length; i += 4) {
            const [r, g, b, a] = [px[i], px[i + 1], px[i + 2], px[i + 3]];
            if (a < 200) continue;
            const max = Math.max(r, g, b) / 255, min = Math.min(r, g, b) / 255, l = (max + min) / 2;
            const s = max === min ? 0 : (max - min) / (1 - Math.abs(2 * l - 1));
            if (s < .35 || l < .15 || l > .9) continue;          // בלי שחור, לבן ואפור
            let h = 0, d = max - min, R = r / 255, G = g / 255, B = b / 255;
            if (max === R) h = ((G - B) / d) % 6; else if (max === G) h = (B - R) / d + 2; else h = (R - G) / d + 4;
            const bin = Math.floor(((h * 60 + 360) % 360) / 30);
            const o = bins[bin] || (bins[bin] = { n: 0, r: 0, g: 0, b: 0 });
            o.n++; o.r += r; o.g += g; o.b += b;
          }
          const top = Object.values(bins).sort((x, y) => y.n - x.n);
          const rgb = o => `rgb(${Math.round(o.r / o.n)}, ${Math.round(o.g / o.n)}, ${Math.round(o.b / o.n)})`;
          app.tint = top.length ? [rgb(top[0]), rgb(top[1] && top[1].n > top[0].n * .08 ? top[1] : top[0])] : null;
        } catch (e) { app.tint = null; }
        resolve(app.tint);
      };
      img.onerror = () => resolve(null);
      img.src = app.icon;
    });
  }
  // צבע הלוגו לכל כרטיס, בשביל המסגרת במעבר עכבר
  function paintCards() {
    $view.querySelectorAll('.card[data-open], .featured[data-open]').forEach(el => {
      const app = APPS.find(a => a.id === el.dataset.open);
      if (!app) return;
      logoColors(app).then(t => { if (t && el.isConnected) el.style.setProperty('--logo', t[0]); });
    });
  }
  function paintFeatured() {
    const el = $view.querySelector('.featured');
    const app = el && APPS.find(a => a.id === el.dataset.open);
    if (!app) return;
    logoColors(app).then(t => {
      if (!t || !el.isConnected) return;
      el.style.setProperty('--c1', t[0]);
      el.style.setProperty('--c2', t[1]);
    });
  }

  function render() {
    const m = location.hash.match(/^#app\/(.+)$/);
    const app = m && APPS.find(a => a.id === decodeURIComponent(m[1]));
    $view.innerHTML = app ? appPage(app) : home();
    document.title = app ? `${app.name} · X Store` : 'X Store · אפליקציות לאנדרואיד';
    if (!app) { paintFeatured(); paintCards(); }
  }

  // ---------- אירועים ----------
  $view.addEventListener('click', e => {
    if (e.target.closest('[data-stop]')) return;
    const chip = e.target.closest('[data-cat]');
    if (chip) { cat = chip.dataset.cat; render(); return; }
    const open = e.target.closest('[data-open]');
    if (open) { location.hash = 'app/' + open.dataset.open; window.scrollTo(0, 0); }
  });
  document.addEventListener('click', e => {
    if (e.target.closest('[data-home]')) { e.preventDefault(); history.pushState(null, '', location.pathname); render(); window.scrollTo(0, 0); }
  });
  q.addEventListener('input', () => { if (location.hash) history.replaceState(null, '', location.pathname); render(); });
  window.addEventListener('hashchange', render);

  // מצב כהה, נזכר בין ביקורים
  const root = document.documentElement;
  try { if (localStorage.getItem('store-theme') === 'dark') root.dataset.theme = 'dark'; } catch (e) {}
  document.getElementById('theme').addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? '' : 'dark';
    try { localStorage.setItem('store-theme', root.dataset.theme); } catch (e) {}
  });

  // ---------- חיצי הגלילה של צילומי המסך ----------
  // בעברית הרשימה מתחילה מימין: "הבאים" גוללים שמאלה (scrollLeft שלילי)
  function updateArrows() {
    const row = $view.querySelector('.shots');
    if (!row) return;
    const max = row.scrollWidth - row.clientWidth;
    const pos = Math.abs(row.scrollLeft);
    $view.querySelector('.shots-arrow.prev').hidden = pos < 4;
    $view.querySelector('.shots-arrow.next').hidden = pos > max - 4 || max < 4;
  }
  $view.addEventListener('click', e => {
    const b = e.target.closest('[data-scroll]');
    if (!b) return;
    const row = $view.querySelector('.shots');
    const step = (row.querySelector('.shot').offsetWidth + 14) * 2;
    row.scrollBy({ left: -step * +b.dataset.scroll, behavior: 'smooth' });
  });
  $view.addEventListener('scroll', e => { if (e.target.classList && e.target.classList.contains('shots')) updateArrows(); }, true);
  window.addEventListener('resize', updateArrows);
  new MutationObserver(() => requestAnimationFrame(updateArrows)).observe($view, { childList: true });
  $view.addEventListener('load', e => { if (e.target.tagName === 'IMG') updateArrows(); }, true);

  // ---------- הגדלת צילום מסך ----------
  const box = document.getElementById('lightbox');
  const boxImg = box.querySelector('img');
  let boxList = [], boxAt = 0;
  function showShot(i) {
    boxAt = (i + boxList.length) % boxList.length;
    boxImg.src = boxList[boxAt];
    box.querySelector('.lb-count').textContent = `${boxAt + 1} / ${boxList.length}`;
  }
  $view.addEventListener('click', e => {
    const b = e.target.closest('[data-shot]');
    if (!b) return;
    const m = location.hash.match(/^#app\/(.+)$/);
    const app = m && APPS.find(a => a.id === decodeURIComponent(m[1]));
    if (!app) return;
    boxList = app.shots; showShot(+b.dataset.shot);
    box.hidden = false; document.body.style.overflow = 'hidden';
  });
  function closeBox() { box.hidden = true; document.body.style.overflow = ''; }
  box.addEventListener('click', e => {
    if (e.target.closest('.lb-prev')) showShot(boxAt - 1);       // בעברית "הקודם" בצד ימין
    else if (e.target.closest('.lb-next')) showShot(boxAt + 1);
    else if (!e.target.closest('img')) closeBox();
  });
  document.addEventListener('keydown', e => {
    if (box.hidden) return;
    if (e.key === 'Escape') closeBox();
    else if (e.key === 'ArrowRight') showShot(boxAt - 1);
    else if (e.key === 'ArrowLeft') showShot(boxAt + 1);
  });

  render();
  APPS.forEach(a => { if (a.repo) { syncFromGitHub(a); syncShots(a); } });
</script>
</body>
</html>
